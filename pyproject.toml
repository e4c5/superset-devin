[project]
name = "superset-devin"
version = "1.0.0"
description = "Event-driven SonarQube remediation orchestrator built on the Devin API v3"
requires-python = ">=3.10"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Verbatim prompt / issue-body text must not be rewrapped.
"app/findings.py" = ["E501"]
"simulator/demo_issues.py" = ["E501"]
